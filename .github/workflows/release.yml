name: release

# Tagging on the release branch publishes a packaged snapshot.
# Release notes come from docs/release-notes/<tag>.md; the tag must match the VERSION file.
# Tags that look like a pre-release (0.1.0a1, -alpha.1, -rc2, ...) are marked as such.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: tests then publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: tag must match the VERSION file
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = (Get-Content VERSION -Raw).Trim()
          if ($tag -ne "v$ver") {
            Write-Error "tag '$tag' does not match VERSION ('$ver') -- bump one of them"
            exit 1
          }
          Write-Output "version $ver confirmed against tag $tag"

      - name: tests must pass before anything is published
        run: |
          python tools/test_selftest.py
          python tools/test_git_parity.py --source testdata/fixture.SC2Map
          python tools/test_bundle.py --source testdata/fixture.SC2Map

      - name: build the Rust CLI (the release ships a compiled binary)
        run: |
          cargo build --release
          cargo test --release

      - name: assemble the distributable
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $out = "sc2diff-$tag"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item README.md,CONTRIBUTING.md,LICENSE,VERSION -Destination $out
          Copy-Item tools,docs,research,src,Cargo.toml,Cargo.lock -Destination $out -Recurse
          Copy-Item target/release/sc2diff.exe -Destination $out
          Get-ChildItem $out -Recurse -Include *.exe,*.obj,*.lib,*.dll | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem $out -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip" -Force
          Get-ChildItem "$out.zip" | Select-Object Name,Length

      - name: pick the release notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $note = "docs/release-notes/$tag.md"
          if (Test-Path $note) { Copy-Item $note notes.md }
          else { Write-Error "missing docs/release-notes/$tag.md"; exit 1 }
          Get-Content notes.md -TotalCount 3

      - name: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          # 0.1.0a1 / 0.1.0b2 / 1.0.0-rc1 / anything with a dash is a pre-release
          $isPre = ($tag -match '(a|b|rc)[0-9]+$') -or ($tag -match '-')
          $ghArgs = @('release', 'create', $tag, '--title', $tag, '--notes-file', 'notes.md')
          if ($isPre) { $ghArgs += '--prerelease'; Write-Output "publishing $tag as a PRE-RELEASE" }
          else { Write-Output "publishing $tag as a full release" }
          $ghArgs += (Get-ChildItem sc2diff-*.zip).FullName
          $ghArgs += "sc2diff-$tag/sc2diff.exe"
          & gh @ghArgs