[package]
name = "sc2diff"
version = "0.1.0-a2"
edition = "2021"
rust-version = "1.85"
description = "StarCraft II map/dependency semantic diff and git-shaped version control"
license = "MIT"

[dependencies]
sha1 = "0.10"
md-5 = "0.10"
crc32fast = "1"
flate2 = "1"
bzip2 = "0.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.36"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
